<svg width="680" height="530" viewBox="0 0 680 530" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="140" y="30" width="400" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">TEDS-D 2015-2020 and 2022</text>
<text x="340" y="72" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">6.68M episodes, 17 substances, 39.7% dropout</text>

<path d="M340 90 V108 H190 V126" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 90 V108 H490 V126" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="130" width="280" height="90" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="190" y="153" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#3C3489">17 substance-specific models</text>
<text x="190" y="175" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">One per substance</text>
<text x="190" y="193" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">435 to 1.74M training episodes</text>

<rect x="350" y="130" width="280" height="90" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="490" y="148" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">1 pooled model</text>
<text x="490" y="168" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Trained on six highest-volume</text>
<text x="490" y="184" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">substances, 4.55M episodes</text>
<text x="490" y="200" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Applied unchanged to all 17</text>

<line x1="190" y1="220" x2="272" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="490" y1="220" x2="408" y2="258" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="190" y="262" width="300" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Same 17 held-out test sets</text>
<text x="340" y="304" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Paired comparison, GBT and LR</text>

<line x1="340" y1="322" x2="340" y2="352" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="358" width="280" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
<text x="190" y="384" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#444441">Higher mean AUROC across substances</text>
<text x="190" y="406" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">0.786 pooled vs 0.776 specific</text>

<rect x="350" y="358" width="280" height="72" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="490" y="377" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">Lower-volume substances gain</text>
<text x="490" y="397" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">+0.034 avg under 5k episodes</text>
<text x="490" y="415" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">+0.102 lowest-volume substance</text>

<rect x="170" y="446" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="340" y="466" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="bold" fill="#085041">More uniform performance</text>
<text x="340" y="486" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">SD 0.017 vs 0.032 across 17 substances</text>
</svg>
